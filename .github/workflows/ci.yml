name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest -v
      - name: Attest tested tree for Governor
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TREE=$(git rev-parse HEAD^{tree})
          # The job id of this job is its check-run id (SPEC 17.4: run=<check-run id>).
          CHECK_RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.name == "test") | .id')
          test -n "$CHECK_RUN_ID"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context=governor/tested-tree \
            -f description="tree=${TREE} run=${CHECK_RUN_ID}"
# synthetic comment added by P2.1 workflow-integrity test
